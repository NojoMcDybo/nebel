<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0D0D'/%3E%3Ccircle cx='23' cy='22' r='3' fill='%23B8362B'/%3E%3Cpath d='M8 23V12.5c0-1.4 1.1-2.5 2.5-2.5h2c2.8 0 5 2.2 5 5V23' fill='none' stroke='%23EDF1F1' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Huelle fuer die Texte zur Entstehung. engine/scripts/build-viewer.mjs setzt den
     Text aus docs/40_*.md ein; Quelle bleibt das Markdown. -->
<script>/* dasselbe Theme wie in der App (Schluessel nebel.theme) */
try { if (localStorage.getItem("nebel.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
<style>
@font-face{font-family:"DM Mono"; font-weight:400; font-display:swap; src:url("{{ROOT}}fonts/dm-mono-400.woff2") format("woff2")}
@font-face{font-family:"Plus Jakarta Sans"; font-weight:200 800; font-display:swap; src:url("{{ROOT}}fonts/plus-jakarta-sans.woff2") format("woff2")}
:root{--paper:#EDF1F1; --card:#FFFFFF; --ink:#0A0D0D; --ink2:#576262; --ink3:#5F6A6A; --hair:rgba(10,13,13,.11)}
:root[data-theme="dark"]{--paper:#0E1213; --card:#191E20; --ink:#E9EFEF; --ink2:#A3AEAE; --ink3:#7E8A8A; --hair:rgba(233,239,239,.14)}
*{box-sizing:border-box}
html{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px; margin:0 auto; padding:28px 16px 72px}
a{color:inherit; text-underline-offset:3px; overflow-wrap:anywhere}
.back{font-family:"DM Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.06em; color:var(--ink3); text-decoration:none}
.back:hover{color:var(--ink); text-decoration:underline}
h1{font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.15; margin:18px 0 8px}
h2{font-size:21px; font-weight:800; letter-spacing:-.02em; margin:34px 0 10px}
h3{font-size:16px; font-weight:700; margin:22px 0 6px}
p, li{color:var(--ink2); font-size:15px}
p{margin:0 0 12px}
strong{color:var(--ink)}
ul, ol{margin:0 0 14px; padding-left:22px}
li{margin:0 0 4px}
hr{border:0; border-top:1px solid var(--hair); margin:30px 0}
code{font-family:"DM Mono",ui-monospace,monospace; font-size:.86em}
pre{background:var(--card); border-radius:12px; box-shadow:0 0 0 1px var(--hair); padding:14px 16px; margin:0 0 16px; overflow-x:auto; line-height:1.5}
pre code{font-size:12.5px; color:var(--ink)}
.tbl{overflow-x:auto; margin:0 0 16px; border-radius:12px; box-shadow:0 0 0 1px var(--hair); background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th, td{text-align:left; vertical-align:top; padding:8px 12px; border-top:1px solid var(--hair); color:var(--ink2)}
th{border-top:0; color:var(--ink); font-weight:700; white-space:nowrap}
td:empty{padding:0}
</style>
</head>
<body>
<main>
  <a class="back" href="./">{{BACK}}</a>
{{BODY}}
  <p><a class="back" href="./">{{BACK}}</a></p>
</main>
</body>
</html>
