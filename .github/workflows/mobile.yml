# Baut die iPhone-App (mobile/) als unsignierte nebel.ipa. Signiert wird später auf dem Handy (SideStore).
#
# Zwei Jobs: Die Parametersaetze, Schriften und Lizenztexte erzeugt engine/ unter Linux
# (oracle:fetch braucht sha256sum, das der macOS-Runner nicht hat). Der macOS-Job holt sie als Artefakt.
name: iPhone-App bauen

on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - engine/src/**
      - engine/scripts/build-viewer.mjs
      - app/adapter.js
      - app/personas.js
      - .github/workflows/mobile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daten:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: py-mgipsim holen (festgehaltener Stand, geprueft)
        run: npm run oracle:fetch
      - name: Seite bauen (liefert Parametersaetze, Schriften, Lizenztexte)
        run: npm run viewer
      - uses: actions/upload-artifact@v4
        with:
          name: engine-site
          path: engine/dist/site
          retention-days: 1

  ipa:
    needs: daten
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-site
          path: engine/dist/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Abhaengigkeiten
        run: npm ci
      - name: Tests und Typen
        run: |
          npm test
          npm run typecheck
      - name: Web-Teil bauen und ins iOS-Projekt kopieren
        run: npm run sync
      - name: Archiv bauen (ohne Signatur)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: ipa packen
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/nebel.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: nebel-ipa
          path: nebel.ipa
          if-no-files-found: error
